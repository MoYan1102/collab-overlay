<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>聯動覆蓋層</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 版面位置：避開雙方角色時改這裡 ===== */
:root {
  --main-x: 470px;  --main-y: 150px;  --main-w: 980px;   /* 題目／卡片區 */
  --vote-x: 1490px; --vote-y: 36px;   --vote-w: 394px;   /* 投票區 */
  --feat-y: 800px;                                       
/* 賽事介紹 */
.infoRows { margin-top: 18px; display: flex; flex-direction: column; }
.infoRows div { display: grid; grid-template-columns: 90px 1fr; gap: 20px; padding: 14px 0; border-top: 1.5px dashed var(--line); font-size: 25px; align-items: baseline; }
.infoRows span { color: var(--mute); font-size: 18px; letter-spacing: .4em; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; margin-top: 8px; }
.wgrid .w { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; padding: 11px 0; border-top: 1.5px dashed var(--line); }
.wgrid .dn { width: 30px; height: 30px; border: 2px solid var(--fg); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; margin-left: 6px; }
.wgrid .dn b { transform: rotate(-45deg); font-family: var(--num); font-size: 16px; }
.wgrid .nm { font-weight: 900; font-size: 23px; letter-spacing: .15em; }
.wgrid .nm em, .wname em { font-style: normal; color: var(--mute); font-weight: 700; font-size: .62em; margin-left: 12px; letter-spacing: .1em; }
.wgrid .ln { font-size: 16px; color: #bbb; margin-top: 2px; }
.wname { font-size: 64px; letter-spacing: .3em; }
.wline { font-size: 26px; font-weight: 700; margin: 4px 0 18px; }


/* 中場 */
.sides2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: stretch; margin-top: 16px; }
.sides2 .vs { align-self: center; font-family: var(--num); color: var(--mute); font-size: 32px; }
.sideCol { border: 2px solid var(--fg); padding: 18px 22px; text-align: center; }
.sideCol.s { background: var(--s-bg); color: var(--s-fg); }
.sideCol .sl { font-size: 18px; letter-spacing: .5em; font-weight: 700; }
.sideCol .sn { font-size: 38px; font-weight: 900; letter-spacing: .15em; margin: 4px 0 10px; }
.sideCol .sh { font-size: 17px; letter-spacing: .3em; opacity: .7; }
.sideCol .ss { font-size: 21px; font-weight: 700; margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed currentColor; }
.steps { margin-top: 10px; }
.stp { display: grid; grid-template-columns: 50px 230px 1fr; gap: 14px; align-items: center; padding: 13px 0; border-top: 1.5px dashed var(--line); }
.stp .dn { width: 30px; height: 30px; border: 2px solid var(--fg); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; margin-left: 8px; }
.stp .dn b { transform: rotate(-45deg); font-family: var(--num); font-size: 16px; }
.stp .sn { font-size: 25px; font-weight: 900; letter-spacing: .12em; }
.stp .sn em { display: block; font-style: normal; font-size: 15px; color: var(--mute); font-weight: 500; letter-spacing: .1em; }
.stp .sd { font-size: 20px; color: #ddd; line-height: 1.6; }

/* 白辯士一頁版 */
.wnames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 0; margin: 12px 0 18px; padding-bottom: 16px; border-bottom: 1.5px dashed var(--line); }
.wnames span { font-size: 24px; font-weight: 900; letter-spacing: .2em; display: flex; align-items: center; gap: 12px; }
.wnames span::before { content: '✦'; font-size: 14px; color: var(--mute); letter-spacing: 0; }
.whl .w { display: grid; grid-template-columns: 270px 1fr; gap: 18px; align-items: baseline; padding: 8px 0; }
.whl .nm { font-weight: 900; font-size: 24px; letter-spacing: .12em; }
.whl .nm em { font-style: normal; color: var(--mute); font-size: 16px; margin-left: 10px; font-weight: 700; }
.whl .ln { font-size: 20px; color: #ddd; line-height: 1.6; }

/* 精選留言 */

  /* 黑白辯士系統配色 */
  --bg: #0b0b0b; --panel: rgba(11,11,11,.92); --panel2: rgba(20,20,20,.94);
  --fg: #fff; --mute: #8a8a8a; --dim: #555; --line: rgba(255,255,255,.35);
  --red: #ff3b30;
  --serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  --num: "Times New Roman", var(--serif);
  /* 蘇格拉底＝白方、豬＝黑方 */
  --s-bg: #fff; --s-fg: #000;
  --p-bg: #000; --p-fg: #fff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--serif); color: var(--fg); }
body.preview #stage { background: #3d4a46 repeating-linear-gradient(45deg, #36423f 0 40px, #3d4a46 40px 80px); }

.frame { background: var(--panel); border: 2.5px solid var(--fg); border-radius: 24px; }
.sq { background: var(--panel); border: 1.5px solid var(--fg); }
.fade { transition: opacity .4s ease, transform .4s ease; }
.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
.spaced { letter-spacing: .35em; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.dash { border-top: 1.5px dashed var(--line); }
.chip { display: inline-block; font-size: 15px; font-weight: 700; padding: 1px 8px; letter-spacing: .15em; }
.chip.s { background: var(--s-bg); color: var(--s-fg); border: 1.5px solid var(--s-bg); }
.chip.p { background: var(--p-bg); color: var(--p-fg); border: 1.5px solid var(--fg); }

/* 節目標題牌 */
#plate { position: absolute; left: 36px; top: 36px; padding: 16px 26px 14px; border-radius: 18px; }
#plate .t { font-weight: 900; font-size: 28px; letter-spacing: .12em; display: flex; align-items: center; gap: 12px; }
#plate .t i { font-style: normal; font-family: var(--num); color: var(--mute); font-size: 22px; letter-spacing: 0; }
#plate .seg { margin-top: 6px; font-size: 16px; color: var(--mute); letter-spacing: .3em; display: flex; gap: 10px; align-items: center; }
#plate .seg::before { content: '✦'; color: var(--fg); letter-spacing: 0; }

/* 投票區 */
#votes { position: absolute; left: var(--vote-x); top: var(--vote-y); width: var(--vote-w); padding: 18px 22px 16px; border-radius: 20px; }
.vh { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 20px; letter-spacing: .15em; }
.vh .k { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; transform: rotate(45deg); border: 2px solid var(--fg); margin: 0 12px 0 6px; }
.vh .k b { transform: rotate(-45deg); font-family: var(--num); font-size: 17px; letter-spacing: 0; }
.vh .s .k { background: var(--s-bg); color: var(--s-fg); }
.vh .p .k { margin: 0 6px 0 12px; }
.vh > span { display: flex; align-items: center; }
.vh .nm { display: flex; flex-direction: column; line-height: 1.15; }
.vh .nm.r { align-items: flex-end; }
.vh .nm small { font-size: 13px; color: var(--mute); letter-spacing: .3em; font-weight: 700; }
.vbar { position: relative; height: 22px; margin: 14px 0 8px; border: 1.5px solid var(--fg); background: var(--p-bg); }
.vbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s-bg); transition: width .7s cubic-bezier(.3,1.2,.5,1); }
.vbar .mark { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px solid var(--red); transition: left .7s; }
.vnum { display: flex; justify-content: space-between; align-items: baseline; }
.vnum .n { font-family: var(--num); font-size: 34px; font-weight: 700; }
.vnum .pc { font-family: var(--num); font-size: 18px; color: var(--mute); margin: 0 6px; }
.vmeta { margin-top: 8px; padding-top: 8px; font-size: 15px; color: var(--mute); display: flex; justify-content: space-between; letter-spacing: .1em; }
.vmeta b { color: var(--red); font-family: var(--num); font-size: 22px; margin: 0 4px; }
#stampsRow { margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--mute); letter-spacing: .2em; }
#stampsRow .seals { display: flex; gap: 6px; }
.seal { width: 30px; height: 30px; border: 2px solid var(--red); color: var(--red); font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; letter-spacing: 0; }
.seal.off { border: 1.5px dashed var(--dim); color: var(--dim); }

/* 主內容區 */
#main { position: absolute; left: var(--main-x); top: var(--main-y); width: var(--main-w); }
.panel { position: absolute; left: 0; top: 0; width: 100%; padding: 30px 44px 34px; }
.kicker { font-size: 17px; color: var(--mute); letter-spacing: .35em; display: flex; align-items: center; gap: 12px; }
.kicker::before { content: '✦'; color: var(--fg); letter-spacing: 0; }
.big { font-weight: 900; font-size: 46px; line-height: 1.35; margin: 16px 0 8px; letter-spacing: .08em; }
.body { font-size: 24px; line-height: 1.8; color: #ddd; font-weight: 500; }
.foot { margin-top: 16px; padding-top: 12px; font-size: 17px; color: var(--mute); letter-spacing: .15em; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 20px; }
.opt { border: 2px solid var(--fg); padding: 16px 18px; font-size: 25px; font-weight: 700; display: flex; gap: 18px; align-items: center; line-height: 1.4; }
.opt .k { flex: none; width: 38px; height: 38px; transform: rotate(45deg); border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; margin: 0 4px; }
.opt .k b { transform: rotate(-45deg); font-family: var(--num); font-size: 20px; }
.opt.s { background: var(--s-bg); color: var(--s-fg); } .opt.s .k { border-color: var(--s-fg); }
.opt.p { background: var(--p-bg); color: var(--p-fg); }
.twist { overflow: hidden; transition: opacity .4s, max-height .4s; font-size: 23px; font-weight: 700; display: flex; gap: 16px; align-items: baseline; }
.twist span { color: var(--red); font-size: 17px; letter-spacing: .3em; flex: none; }
.drawing .big { color: var(--dim); }

/* 法庭 */
#roundHead { position: absolute; left: 0; top: 0; width: 100%; padding: 14px 30px; display: flex; align-items: center; gap: 22px; border-radius: 18px; }
#roundHead .rn { font-size: 18px; letter-spacing: .3em; white-space: nowrap; color: var(--mute); }
#roundHead .rn b { color: var(--fg); font-family: var(--num); font-size: 24px; letter-spacing: 0; margin: 0 4px; }
#roundHead .rt { font-weight: 900; font-size: 27px; letter-spacing: .08em; flex: 1; }
#roundHead .ph { font-size: 17px; font-weight: 700; letter-spacing: .25em; padding: 4px 12px; border: 1.5px solid var(--fg); white-space: nowrap; }
#roundHead .ph:empty { display: none; }
#cardPanel { top: 96px; padding: 0; }
.card { border: 2.5px solid var(--fg); border-radius: 24px; padding: 26px 40px 30px; position: relative; overflow: hidden; }
.card.s { background: rgba(255,255,255,.96); color: #000; }
.card.p { background: var(--panel); color: #fff; }
.card .tag { display: flex; gap: 14px; align-items: center; font-size: 16px; letter-spacing: .3em; }
.card .tag .who { font-weight: 900; }
.card .tag .ty { padding: 2px 10px; border: 1.5px solid currentColor; }
.card.q .tag .ty { background: var(--red); color: #fff; border-color: var(--red); }
.card .ttl { font-weight: 900; font-size: 44px; margin: 14px 0 10px; letter-spacing: .06em; line-height: 1.3; }
.card .bd { font-size: 25px; line-height: 1.75; font-weight: 500; }
.card.s .bd { color: #222; } .card.p .bd { color: #ddd; }
.card .corner { position: absolute; font-size: 22px; opacity: .7; }
.card .c1 { right: 18px; top: 12px; } .card .c2 { right: 18px; bottom: 12px; }
.card.in { animation: cardIn .5s cubic-bezier(.2,1.25,.4,1); }
@keyframes cardIn { from { transform: translateY(36px) scale(.94); opacity: 0; } }

#timer { position: absolute; left: var(--main-x); width: var(--main-w); top: 86px; display: flex; justify-content: flex-end; }
#timer .box { padding: 4px 18px; display: flex; gap: 14px; align-items: baseline; }
#timer .lb { font-size: 15px; color: var(--mute); letter-spacing: .3em; }
#timer #tVal { font-family: var(--num); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
#timer.over .box { border-color: var(--red); background: var(--red); }
#timer.over .lb { color: #fff; }

/* 結果 */
.vrow { margin-top: 22px; }
.vrow .l { display: flex; justify-content: space-between; font-size: 18px; letter-spacing: .2em; color: var(--mute); }
.vrow .vbar { height: 34px; margin: 8px 0 4px; }
.vrow .lbl { display: flex; justify-content: space-between; font-family: var(--num); font-size: 22px; }
.stampTally { display: flex; justify-content: center; align-items: center; gap: 70px; margin-top: 28px; padding-top: 22px; font-weight: 900; font-size: 24px; letter-spacing: .25em; }
.stampTally b { font-family: var(--num); font-size: 64px; color: var(--red); margin-left: 14px; letter-spacing: 0; }
.stampTally small { font-size: 16px; color: var(--mute); margin-left: 8px; letter-spacing: .1em; }
.stampTally .vs { font-family: var(--num); color: var(--dim); font-size: 30px; letter-spacing: 0; }


/* 賽事介紹 */
.infoRows { margin-top: 18px; display: flex; flex-direction: column; }
.infoRows div { display: grid; grid-template-columns: 90px 1fr; gap: 20px; padding: 14px 0; border-top: 1.5px dashed var(--line); font-size: 25px; align-items: baseline; }
.infoRows span { color: var(--mute); font-size: 18px; letter-spacing: .4em; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; margin-top: 8px; }
.wgrid .w { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; padding: 11px 0; border-top: 1.5px dashed var(--line); }
.wgrid .dn { width: 30px; height: 30px; border: 2px solid var(--fg); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; margin-left: 6px; }
.wgrid .dn b { transform: rotate(-45deg); font-family: var(--num); font-size: 16px; }
.wgrid .nm { font-weight: 900; font-size: 23px; letter-spacing: .15em; }
.wgrid .nm em, .wname em { font-style: normal; color: var(--mute); font-weight: 700; font-size: .62em; margin-left: 12px; letter-spacing: .1em; }
.wgrid .ln { font-size: 16px; color: #bbb; margin-top: 2px; }
.wname { font-size: 64px; letter-spacing: .3em; }
.wline { font-size: 26px; font-weight: 700; margin: 4px 0 18px; }

/* 精選留言 */
#featured { position: absolute; left: 50%; top: var(--feat-y); transform: translateX(-50%); max-width: 1120px; min-width: 520px; padding: 16px 30px; display: flex; gap: 20px; align-items: flex-start; border-radius: 20px; }
#featured.hidden { transform: translate(-50%, 12px); }
#featured .k { flex: none; background: var(--fg); color: #000; font-size: 15px; font-weight: 900; padding: 3px 10px; letter-spacing: .2em; margin-top: 6px; }
#featured .u { color: var(--mute); font-size: 16px; letter-spacing: .1em; }
#featured .x { font-size: 27px; font-weight: 700; line-height: 1.5; }

/* 常駐說明條 */
#bar { position: absolute; left: 0; bottom: 0; width: 1920px; height: 56px; background: rgba(0,0,0,.94); border-top: 1.5px solid var(--fg); display: flex; align-items: center; font-size: 20px; }
#bar .now { padding: 0 28px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .08em; display: flex; align-items: center; gap: 14px; }
#bar .now::before { content: '✦'; }
#bar .how { padding: 0 24px; height: 100%; display: flex; align-items: center; gap: 10px; border-left: 1.5px dashed var(--line); white-space: nowrap; letter-spacing: .1em; color: #ddd; }
#bar .how b { font-family: var(--num); display: inline-block; padding: 0 8px; border: 1.5px solid var(--fg); }
#bar .how .s { background: var(--s-bg); color: var(--s-fg); }
#bar .ev { padding: 0 28px; height: 100%; display: flex; align-items: center; background: var(--fg); color: #000; font-weight: 900; white-space: nowrap; letter-spacing: .12em; }

/* 蓋章特效 */
#stampFx { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); pointer-events: none; opacity: 0; }
#stampFx .ring { padding: 26px 46px; border: 10px solid var(--red); border-radius: 22px; color: var(--red); font-weight: 900; text-align: center; background: rgba(11,11,11,.92); transform: rotate(-8deg); white-space: nowrap; }
#stampFx .ring small { display: block; font-size: 22px; letter-spacing: .4em; }
#stampFx .ring span { display: block; font-size: 76px; line-height: 1.3; letter-spacing: .2em; }
#stampFx .ring span em { display: block; font-style: normal; font-size: 30px; letter-spacing: .2em; }
#stampFx.go { animation: stamp 2.6s ease forwards; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%,-50%) scale(2.4); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(.95); } 18% { transform: translate(-50%,-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }

#conn { position: absolute; right: 10px; bottom: 64px; font-size: 13px; padding: 2px 8px; background: var(--red); color: #fff; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="plate" class="frame"><div class="t" id="plateTitle"></div><div class="seg" id="seg"></div></div>

  <div id="votes" class="frame fade">
    <div class="vh"><span class="s"><span class="k"><b>1</b></span><span class="nm"><small>正方</small>蘇格拉底</span></span><span class="p"><span class="nm r"><small>反方</small>快樂的豬</span><span class="k"><b>2</b></span></span></div>
    <div class="vbar"><i id="vFill"></i><div class="mark" id="vMark"></div></div>
    <div class="vnum"><span><span class="n" id="vS">0</span><span class="pc" id="vSp"></span></span><span><span class="pc" id="vPp"></span><span class="n" id="vP">0</span></span></div>
    <div class="vmeta dash" id="vMeta"></div>
    <div id="stampsRow" class="dash"><div class="seals" id="sealsS"></div><span>陪審團印章</span><div class="seals" id="sealsP"></div></div>
  </div>

  <div id="timer" class="hidden fade"><div class="box sq"><span class="lb" id="tLabel"></span><span id="tVal"></span></div></div>

  <div id="main">
    <div id="storyPanel" class="panel frame fade hidden"></div>
    <div id="infoPanel" class="panel frame fade hidden"></div>
    <div id="qPanel" class="panel frame fade hidden"></div>
    <div id="roundHead" class="frame fade hidden"><span class="rn" id="rn"></span><span class="rt" id="rt"></span><span class="ph" id="ph"></span></div>
    <div id="cardPanel" class="panel fade hidden"></div>
    <div id="verdictPanel" class="panel frame fade hidden"></div>
  </div>

  <div id="featured" class="frame fade hidden"><span class="k" id="fK"></span><div><div class="u" id="fU"></div><div class="x" id="fX"></div></div></div>

  <div id="bar"><div class="now" id="barNow"></div><div class="how">打 <b class="s">1</b> 正方（蘇格拉底）　打 <b>2</b> 反方（快樂的豬）</div><div class="ev" id="barEv"></div></div>

  <div id="stampFx"><div class="ring"><small>陪審團印章</small><span id="fxSide"></span><small id="fxRound"></small></div></div>
  <div id="conn"></div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="sync.js"></script>
<script>
const D = window.SHOW_DATA;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.has('preview')) document.body.classList.add('preview');

function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();

$('plateTitle').innerHTML = D.title.replace(' vs ', '<i>VS</i>');
$('barEv').textContent = D.event.short;

const show = (el, on) => el.classList.toggle('hidden', !on);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROUND_ZH = ['', '第一輪', '第二輪', '第三輪'];
const prev = { drawT: null, cardT: null, stampT: null };
let drawTimer = null;
const pct = (s, p) => s + p === 0 ? 50 : Math.round(s / (s + p) * 100);

function renderVotes(st) {
  const v = st.votes, sc = st.scene, tot = Sync.totals(st);
  show($('votes'), v.show && ['story', 'act1', 'intermission', 'court', 'verdict'].includes(sc));
  const ps = pct(tot.s, tot.p);
  $('vFill').style.width = ps + '%';
  $('vS').textContent = tot.s; $('vP').textContent = tot.p;
  $('vSp').textContent = ps + '%'; $('vPp').textContent = (100 - ps) + '%';
  const inCourt = sc === 'court' || sc === 'verdict';
  if (v.hasBase && inCourt) {
    const bs = pct(v.baseS, v.baseP);
    $('vMark').style.display = ''; $('vMark').style.left = bs + '%';
    $('vMeta').innerHTML = `<span>入席 正方 ${bs}%</span><span>倒戈<b>${tot.turn}</b>人</span>`;
  } else {
    $('vMark').style.display = 'none';
    $('vMeta').innerHTML = `<span>聊天室打 1 或 2 表態</span><span>${D.hosts.s} × ${D.hosts.p}</span>`;
  }
  $('stampsRow').style.display = inCourt ? '' : 'none';
  const stamps = st.court.stamps;
  const won = side => [1, 2, 3].map(r => stamps['r' + r] === side);
  $('sealsS').innerHTML = won('s').map(w => `<div class="seal ${w ? '' : 'off'}">正</div>`).join('');
  $('sealsP').innerHTML = won('p').map(w => `<div class="seal ${w ? '' : 'off'}">反</div>`).join('');
}

function renderStory(st) {
  const n = st.story.idx, c = D.story[n] || D.story[0];
  const same = D.story.filter(x => x.part === c.part), i = same.indexOf(c) + 1;
  const k = c.part === 'main' ? `辯題小故事　${i} / ${same.length}　${c.kicker}` : c.kicker;
  $('storyPanel').innerHTML = `<div class="kicker">${k}</div><div class="big">${c.title}</div><div class="body">${c.body}</div>${c.foot ? `<div class="foot dash">${c.foot}</div>` : ''}`;
}

function eventHTML(pg) {
  const e = D.event;
  if (pg.type === 'info') {
    return `<div class="kicker">${pg.kicker}</div><div class="big" style="font-size:40px">${pg.title}</div>
      <div class="infoRows">
        <div><span>日期</span><b>${e.date}</b></div>
        <div><span>線上</span><b>${e.stream}</b></div>
        <div><span>現場</span><b>${e.venue}</b></div>
      </div>`;
  }
  if (pg.type === 'whites') {
    return `<div class="kicker">${pg.kicker}　共 ${pg.names.length} 位</div><div class="big" style="font-size:36px">${pg.title}</div>
      <div class="wnames">${pg.names.map(n => `<span>${n}</span>`).join('')}</div>
      <div class="whl">${pg.highlights.map(h => `<div class="w"><div class="nm">${h.name}${h.nick ? `<em>${h.nick}</em>` : ''}</div><div class="ln">${h.line}</div></div>`).join('')}</div>`;
  }
  const body = pg.bodyFrom === 'points' ? e.points.map(p => '・' + p).join('<br>') : pg.body;
  return `<div class="kicker">${pg.kicker}</div><div class="big">${pg.title}</div><div class="body">${body}</div>`;
}

function renderInfo(st) {
  if (st.scene === 'event') { $('infoPanel').innerHTML = eventHTML(D.eventPages[st.evt.idx] || D.eventPages[0]); return; }
  if (st.scene === 'ending') { $('infoPanel').innerHTML = eventHTML(D.eventPages.find(p => p.type === 'info')); return; }
  const pg = D.interPages[st.inter.idx] || D.interPages[0];
  $('infoPanel').innerHTML = interHTML(pg);
}

function interHTML(pg) {
  const i = D.interPages.indexOf(pg) + 1, k = `${pg.kicker}　${i} / ${D.interPages.length}`;
  if (pg.kind === 'sides') {
    const col = sd => `<div class="sideCol ${sd}"><div class="sl">${D.sideShort[sd]}</div><div class="sn">${D.sideName[sd]}</div>
      <div class="sh">${D.hosts[sd]}</div><div class="ss">${sd === 's' ? '寧可痛苦，也要清醒地活' : '人生的目的就是幸福快樂'}</div></div>`;
    return `<div class="kicker">${k}</div><div class="big" style="font-size:36px">${pg.title}</div><div class="sides2">${col('s')}<span class="vs">VS</span>${col('p')}</div>`;
  }
  if (pg.steps) {
    return `<div class="kicker">${k}</div><div class="big" style="font-size:36px">${pg.title}</div>
      <div class="steps">${pg.steps.map((x, n) => `<div class="stp"><span class="dn"><b>${n + 1}</b></span><div class="sn">${x[0]}${x[1] ? `<em>${x[1]}</em>` : ''}</div><div class="sd">${x[2]}</div></div>`).join('')}</div>`;
  }
  return `<div class="kicker">${k}</div><div class="big">${pg.title}</div><div class="body">${pg.body}</div>`;
}

function qHTML(q, i, twist) {
  const no = q.tag ? `${q.tag}題` : '人生觀二選一';
  return `<div class="kicker">情境題輪盤　${no}</div><div class="big">${esc(q.title)}</div>
    <div class="opts"><div class="opt s"><span class="k"><b>1</b></span>${esc(q.s)}</div><div class="opt p"><span class="k"><b>2</b></span>${esc(q.p)}</div></div>
    <div class="twist ${twist ? 'dash' : ''}" style="opacity:${twist ? 1 : 0};max-height:${twist ? '140px' : '0'};${twist ? 'margin-top:22px;padding-top:16px' : ''}"><span>延伸追問</span>${esc(q.twist)}</div>`;
}

function renderAct1(st) {
  const a = st.act1, q = D.scenarios[a.q], panel = $('qPanel');
  if (!q) { show(panel, false); return; }
  show(panel, true);
  const fresh = a.drawT && a.drawT !== prev.drawT && Sync.now() - a.drawT < 4000;
  if (prev.drawT === null) prev.drawT = a.drawT;
  if (fresh) {
    prev.drawT = a.drawT;
    clearInterval(drawTimer);
    panel.classList.add('drawing');
    let n = 0;
    drawTimer = setInterval(() => {
      const r = D.scenarios[Math.floor(Math.random() * D.scenarios.length)];
      panel.innerHTML = `<div class="kicker">情境題輪盤　抽題中</div><div class="big">${esc(r.title)}</div>`;
      if (++n > 12) {
        clearInterval(drawTimer); drawTimer = null;
        panel.classList.remove('drawing');
        const cur = Sync.get().act1;
        panel.innerHTML = qHTML(D.scenarios[cur.q] || q, cur.q, cur.twist);
      }
    }, 90);
  } else if (!drawTimer) {
    prev.drawT = a.drawT;
    panel.innerHTML = qHTML(q, a.q, a.twist);
  }
}

function getCard(c) {
  if (c.id === 'custom') return c.custom && c.custom.title ? c.custom : null;
  return (D.cards[c.side] || []).find(x => x.id === c.id);
}

function renderCourt(st) {
  const c = st.court;
  $('rn').innerHTML = `第<b>${c.round}</b>輪`;
  $('rt').textContent = D.topic;
  $('ph').textContent = c.phase || '';
  const card = getCard(c.card), panel = $('cardPanel');
  if (!card || !c.card.side) { show(panel, false); prev.cardT = c.card.t; return; }
  if (c.card.t !== prev.cardT) {
    prev.cardT = c.card.t;
    const sd = c.card.side;
    panel.innerHTML = `<div class="card ${sd} ${card.type} in">
      <span class="corner c1">✦</span><span class="corner c2">✦</span>
      <div class="tag"><span class="who">${D.hosts[sd]}　${D.sides[sd]}</span><span class="ty">${card.type === 'q' ? '質詢卡' : '論點卡'}</span></div>
      <div class="ttl">${esc(card.title)}</div>${card.body ? `<div class="bd">${esc(card.body)}</div>` : ''}</div>`;
  }
  show(panel, true);
}

function renderVerdict(st) {
  const v = st.votes, stamps = st.court.stamps, tot = Sync.totals(st);
  const bs = pct(v.baseS, v.baseP), fs = pct(tot.s, tot.p);
  const cnt = side => [1, 2, 3].filter(r => stamps['r' + r] === side).length;
  const row = (lb, ps, s, p) => `<div class="vrow"><div class="l"><span>${lb}</span></div><div class="vbar"><i style="width:${ps}%"></i></div>
    <div class="lbl"><span>正方（蘇格拉底）　${ps}%（${s}）</span><span>（${p}）${100 - ps}%　反方（快樂的豬）</span></div></div>`;
  $('verdictPanel').innerHTML = `<div class="kicker">最終裁決</div><div class="big" style="font-size:40px">${D.topic}</div>
    ${v.hasBase ? row('入席表態', bs, v.baseS, v.baseP) : ''}${row('最終裁決', fs, tot.s, tot.p)}
    <div class="stampTally dash"><span>正方<small>蘇格拉底</small><b>${cnt('s')}</b></span><span class="vs">VS</span><span>反方<small>快樂的豬</small><b>${cnt('p')}</b></span></div>`;
}

function renderTimer() {
  const st = Sync.get(), t = st.court.timer;
  const on = st.scene === 'court' && t.running;
  show($('timer'), on);
  if (!on) { $('timer').classList.remove('over'); return; }
  const left = Math.ceil((t.start + t.dur * 1000 - Sync.now()) / 1000), a = Math.abs(left);
  $('tLabel').textContent = left >= 0 ? (t.label || '發言') : '時間到';
  $('tVal').textContent = (left < 0 ? '+' : '') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0');
  $('timer').classList.toggle('over', left < 0);
}
setInterval(renderTimer, 250);

function renderFeatured(st) {
  const f = st.featured, on = f.show && f.text;
  if (on) { $('fK').textContent = f.kind || '精選留言'; $('fU').textContent = f.user || ''; $('fX').textContent = f.text; }
  show($('featured'), on);
}

function stampFx(st) {
  const e = st.court.stampEvt;
  if (prev.stampT === null) { prev.stampT = e.t; return; }
  if (e.t && e.t !== prev.stampT) {
    prev.stampT = e.t;
    if (Sync.now() - e.t > 5000 || !e.side) return;
    $('fxSide').innerHTML = `${D.sideShort[e.side]}<em>${D.sideName[e.side]}</em>`;
    $('fxRound').textContent = ROUND_ZH[e.round] || '';
    const fx = $('stampFx'); fx.classList.remove('go'); void fx.offsetWidth; fx.classList.add('go');
  }
}

Sync.onChange(st => {
  const sc = st.scene;
  $('seg').textContent = D.sceneNames[sc] || '';
  $('barNow').textContent = st.bar.custom || D.sceneHints[sc] || '';
  show($('storyPanel'), sc === 'story');
  show($('infoPanel'), ['event', 'intermission', 'ending'].includes(sc));
  show($('roundHead'), sc === 'court');
  show($('verdictPanel'), sc === 'verdict');
  if (sc === 'story') renderStory(st);
  if (['event', 'intermission', 'ending'].includes(sc)) renderInfo(st);
  if (sc === 'act1') renderAct1(st); else show($('qPanel'), false);
  if (sc === 'court') renderCourt(st); else show($('cardPanel'), false);
  if (sc === 'verdict') renderVerdict(st);
  renderVotes(st); renderFeatured(st); stampFx(st); renderTimer();
});
Sync.onStatus(s => {
  const el = $('conn');
  el.style.display = (s === 'offline' || s === 'error') ? 'block' : 'none';
  el.textContent = s === 'error' ? '同步載入失敗' : '同步中斷，重新連線中';
});
</script>
</body>
</html>
